# This collection is not a Python package. The project table only exists so uv can manage the
# environment the tests run in.
[project]
name = "kriansa-quadlet-tests"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false
default-groups = ["test"]

[dependency-groups]
test = [
  # Pinned to one minor release: rendered goldens depend on the templating engine's exact output
  "ansible-core>=2.20.7,<2.21",
  "pytest>=8.4",
  "pytest-cov>=6",
  "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tests/fixtures", "tests/output", "tests/integration/apps"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  # The VM suite is opt-in; passing `-m integration` replaces this, since the last -m wins
  "-m", "not integration",
]
# Markers are registered in tests/conftest.py, so ansible-test sees them too
xfail_strict = true

[tool.coverage.run]
branch = true
source_pkgs = ["ansible_collections.kriansa.quadlet.plugins"]

[tool.coverage.paths]
plugins = ["plugins/", "*/ansible_collections/kriansa/quadlet/plugins/"]

[tool.black]
line-length = 100
extend-exclude = "tests/fixtures/"
