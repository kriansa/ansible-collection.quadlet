{# Rendered by Ansible on every deploy; this comment never reaches the host #}
name = {{ quadlet_app_name }}
token = {{ lookup('passwordstore', 'test/templating/token') }}
optional = {{ lookup('passwordstore', 'test/templating/optional missing=empty') | default('', true) }}
{% for flag in feature_flags %}
feature.{{ flag }} = on
{% endfor %}
template_example = {% raw %}{{ written for the app, not for Ansible }}{% endraw %}

escaped_braces = {{ '{{' }} left as is
