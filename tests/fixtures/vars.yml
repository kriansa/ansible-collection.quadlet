# Variables every example app is rendered with, standing in for a playbook's play and task vars.
# All addresses and names are reserved for documentation or testing.
public_ip: 192.0.2.10
domain: www.example.test
nginx_version: "1.29"
nginx_port: 8080
postgres_version: 17
backup_schedule: "*-*-* 03:00:00"
api_version: 2.4.1
agent_version: v1.20.0
alpine_version: "3.24"
# Unquoted on purpose: YAML reads the first as a float and the second as a date, and a template
# has to render both the way they were written
schema_version: 18.6
release_date: 2026-09-28
enable_debug: false
feature_flags: [search, export]
# What an earlier ansible.builtin.getent task in the play would have gathered
ansible_facts:
  getent_group:
    video: [x, "39", ""]
