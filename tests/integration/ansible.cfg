# Configuration for every ansible-playbook the integration tests start against the VM.
[defaults]
host_key_checking = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# This machine has cowsay installed, which would wrap every task name in a cow
nocows = True
callbacks_enabled = qa_capture

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
